<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .arrow-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .line {
            width: 100%;
            height: 2px;
            background-color: gray;
            position: absolute;
            top: 50%;
            left: 0;
            z-index: 1;
        }

        .arrow-left, .arrow-right {
            width: 0;
            height: 0;
            border-style: solid;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
        }

        .arrow-left {
            border-width: 5px 10px 5px 0;
            border-color: transparent gray transparent transparent;
            left: 0;
        }

        .arrow-right {
            border-width: 5px 0 5px 10px;
            border-color: transparent transparent transparent gray;
            right: 0;
        }

        .arrow-text {
            position: relative;
            background-color: white;
            color: red;
            padding: 0 5px;
            z-index: 3;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="arrow-container">
        <div class="line"></div>
        <div class="arrow-left"></div>
        <div class="arrow-right"></div>
        <div class="arrow-text">111111</div>
    </div>
</body>
</html>
